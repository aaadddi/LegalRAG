services:
  backend:
    build: .
    env_file: .env
    volumes:
      # Persist SQLite + Chroma data across container restarts/redeploys.
      # Persist API-created report markdown files too (see api/main.py
      # create_report, which writes into data/).
      - ./data:/app/data
      - ./store_data/incidents.db:/app/store/incidents.db
      - ./store_data/chroma_db:/app/store/chroma_db
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    # Point this at your Next.js project directory - adjust the path
    # if it lives outside this repo.
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # Must be a build arg, not just env_file below - Next.js inlines
        # NEXT_PUBLIC_ vars into the client bundle at build time, before
        # the container (and its env_file) ever starts. Sourced from the
        # root .env file (docker compose auto-loads it for ${...}
        # substitution here).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file: ./.env
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
