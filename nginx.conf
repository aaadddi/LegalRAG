# Serves the legal-rag app at the /legalRag path on this subdomain
# (e.g. app.adityakashyap.work), matching what the Vercel rewrite on the
# main domain forwards through.
#
# Path design:
#   /legalRag/api/*  -> FastAPI backend (prefix stripped before forwarding)
#   /legalRag/*      -> Next.js frontend (prefix kept - Next's basePath
#                        config expects requests to already be prefixed)

server {
    listen 80;
    server_name app.adityakashyap.work;

    # Convenience redirect so visiting the bare subdomain lands on the app.
    location = / {
        return 302 /legalRag/;
    }

    # API routes - strip /legalRag/api/ before forwarding to FastAPI,
    # since the backend itself has no knowledge of the /legalRag prefix.
    location /legalRag/api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /legalRag - forward to Next.js with the prefix
    # intact, since basePath: '/legalRag' in next.config.js makes the
    # frontend expect requests (including /_next/* asset requests) to
    # already carry that prefix.
    location /legalRag/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Certbot will add a second `server` block here for port 443 (HTTPS)
# automatically when you run `certbot --nginx` - see DEPLOY.md.